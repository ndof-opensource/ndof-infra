# Keeps the supply-chain pins fresh: opens PRs when a pinned GitHub Action
# has a new release or Canonical publishes a newer ubuntu:24.04 base image.
# Every such PR triggers test-infra.yml, so bumps arrive pre-validated and
# are adopted by review — pins never rot silently.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # One batched PR per week instead of one PR per action; the batch is
    # validated as a whole by test-infra.yml.
    groups:
      github-actions:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: /image
    schedule:
      interval: weekly
    # Digest refreshes of the current base keep arriving; moving to any new
    # Ubuntu release, major or interim, is a platform migration (base tag,
    # LLVM apt repo codename, apt package review, decision record) done
    # deliberately, never as an automated bump. Interim releases are also
    # EOL within months.
    ignore:
      - dependency-name: ubuntu
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
