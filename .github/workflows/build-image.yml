name: Build and publish dev image

on:
  push:
    branches: [main]
    paths:
      - "image/**"
      - "conan/profiles/**"
      - ".github/workflows/build-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      # Third-party actions are pinned to commit SHAs (tags are mutable and
      # have been retargeted in real supply-chain attacks); Dependabot
      # (github-actions ecosystem) keeps the pins fresh via reviewed PRs.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/ndof-dev
          tags: |
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - id: push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: image/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Attach an SBOM (per-package inventory) and SLSA provenance
          # attestation to every published image, so each digest carries a
          # verifiable answer to "what is inside, and what built it".
          sbom: true
          provenance: mode=max

      - name: Print digest for pinning
        run: |
          echo "Pin this image in each project's devcontainer.json and CI as:"
          echo "  ghcr.io/${{ github.repository_owner }}/ndof-dev@${{ steps.push.outputs.digest }}"
