name: Build and publish dev image

on:
  push:
    branches: [main]
    paths:
      - "image/**"
      - "conan/profiles/**"
      - ".github/workflows/build-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      # Third-party actions are pinned to commit SHAs (tags are mutable and
      # have been retargeted in real supply-chain attacks); Dependabot
      # (github-actions ecosystem) keeps the pins fresh via reviewed PRs.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/ndof-dev
          tags: |
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: image/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Attach an SBOM (per-package inventory) and SLSA provenance
          # attestation to every published image, so each digest carries a
          # verifiable answer to "what is inside, and what built it".
          sbom: true
          provenance: mode=max

      - name: Print digest for pinning
        run: |
          echo "Pin this image in each project's devcontainer.json and CI as:"
          echo "  ghcr.io/${{ github.repository_owner }}/ndof-dev@${{ steps.push.outputs.digest }}"
