# Reusable CI for all ndof library repositories.
#
# Each library repo calls this with a four-line stub. The Linux jobs run
# inside the dev image that the calling repo pins in
# .devcontainer/devcontainer.json (identical to the local devcontainer);
# the macOS and Windows jobs run on native runners and are the portability
# enforcers: the container guarantees consistency, this matrix guarantees
# compatibility.
#
# The image digest lives in exactly one file per repo,
# .devcontainer/devcontainer.json. The digest-sync job reads it there and
# hands it to every container job, keeping CI in sync with the environment
# a developer's editor starts from the same line. A legacy `image` input is
# still accepted from older stubs; when given, it must equal that pin.
#
# Container jobs run with `--user root`: the runner's work directories belong
# to the host runner user, and actions must write state files there, which
# the image's non-root `dev` user cannot (EACCES at checkout). Devcontainers
# are unaffected; they select `dev` via remoteUser.

name: Library CI

on:
  workflow_call:
    inputs:
      image:
        description: "Legacy override; the digest is normally read from .devcontainer/devcontainer.json"
        required: false
        type: string

env:
  # Tool versions for the native macOS/Windows jobs.
  # Keep in sync with image/Dockerfile.
  CONAN_VERSION: 2.9.2
  CMAKE_VERSION: 3.30.5
  NINJA_VERSION: 1.11.1.1

jobs:
  digest-sync:
    runs-on: ubuntu-24.04
    outputs:
      image: ${{ steps.read.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Read the image pin from devcontainer.json
        id: read
        env:
          LEGACY_IMAGE: ${{ inputs.image }}
        # devcontainer.json is JSONC (comments allowed), so extract with sed
        # rather than a strict JSON parser.
        run: |
          devc_image=$(sed -n 's/^[[:space:]]*"image":[[:space:]]*"\([^"]*\)".*/\1/p' .devcontainer/devcontainer.json | head -n 1)
          if [[ -z "$devc_image" ]]; then
            echo '::error file=.devcontainer/devcontainer.json::no "image" entry found - every ndof repo pins its dev environment here'
            exit 1
          fi
          if [[ -n "$LEGACY_IMAGE" && "$LEGACY_IMAGE" != "$devc_image" ]]; then
            echo "::error file=.devcontainer/devcontainer.json::the image input ($LEGACY_IMAGE) differs from the devcontainer pin ($devc_image); drop the input from the stub or make them equal"
            exit 1
          fi
          echo "image=$devc_image" >> "$GITHUB_OUTPUT"
          echo "environment: $devc_image"

  format:
    needs: digest-sync
    runs-on: ubuntu-24.04
    container:
      image: ${{ needs.digest-sync.outputs.image }}
      options: --user root
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: clang-format
        run: git ls-files '*.cpp' '*.hpp' | xargs -r clang-format --dry-run -Werror
      # The shipped implementation tier is spelled details/ (decision 14 in
      # ndof-infra docs/decisions.md). Sibling conventions from other projects
      # (detail/, internal/) and case variants are rejected programmatically, so a
      # mistyped directory fails CI instead of waiting for review to notice.
      - name: Header layout naming (decision 14)
        run: |
          bad=$(find include -type d \( -iname detail -o -iname internal -o \( -iname details ! -name details \) \) 2>/dev/null || true)
          if [[ -n "$bad" ]]; then
            echo "::error::wrong implementation-tier directory name(s): $bad. Use details/ (decision 14)."
            exit 1
          fi

  linux:
    needs: digest-sync
    runs-on: ubuntu-24.04
    container:
      image: ${{ needs.digest-sync.outputs.image }}
      options: --user root
    strategy:
      fail-fast: false
      matrix:
        profile: [linux-gcc14, linux-clang19]
        build_type: [Debug, Release]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Add ndof public Conan remote
        run: conan remote add ndof-public https://conan.cloudsmith.io/ndof-opensource/packages/ --force
      - name: Resolve dependencies
        run: >
          conan install . --build=missing
          -pr:a /opt/conan/profiles/${{ matrix.profile }}
          -s build_type=${{ matrix.build_type }}
      - name: Configure
        run: cmake --preset ${{ matrix.build_type == 'Debug' && 'debug' || 'release' }}
      - name: Build
        run: cmake --build --preset ${{ matrix.build_type == 'Debug' && 'debug' || 'release' }}
      - name: Test
        run: ctest --preset ${{ matrix.build_type == 'Debug' && 'debug' || 'release' }}

  sanitize:
    name: ASan + UBSan
    needs: digest-sync
    runs-on: ubuntu-24.04
    container:
      image: ${{ needs.digest-sync.outputs.image }}
      options: --user root
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Add ndof public Conan remote
        run: conan remote add ndof-public https://conan.cloudsmith.io/ndof-opensource/packages/ --force
      - run: >
          conan install . --build=missing
          -pr:a /opt/conan/profiles/linux-clang19
          -s build_type=Debug
      - run: cmake --preset asan
      - run: cmake --build --preset asan
      - run: ctest --preset asan

  tidy:
    name: clang-tidy
    needs: digest-sync
    runs-on: ubuntu-24.04
    container:
      image: ${{ needs.digest-sync.outputs.image }}
      options: --user root
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Add ndof public Conan remote
        run: conan remote add ndof-public https://conan.cloudsmith.io/ndof-opensource/packages/ --force
      - run: >
          conan install . --build=missing
          -pr:a /opt/conan/profiles/linux-clang19
          -s build_type=Debug
      - run: cmake --preset debug
      - run: run-clang-tidy -p build/Debug -warnings-as-errors='*' -quiet

  cppcheck:
    needs: digest-sync
    runs-on: ubuntu-24.04
    container:
      image: ${{ needs.digest-sync.outputs.image }}
      options: --user root
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Add ndof public Conan remote
        run: conan remote add ndof-public https://conan.cloudsmith.io/ndof-opensource/packages/ --force
      - run: >
          conan install . --build=missing
          -pr:a /opt/conan/profiles/linux-clang19
          -s build_type=Debug
      - run: cmake --preset debug
      # Second static analyzer alongside clang-tidy: different engine,
      # different defect classes. Driven by the compile database so it
      # analyzes exactly the translation units CMake compiles.
      # --library=googletest teaches cppcheck gtest's TEST() macros; without
      # it the test files are unparseable (syntaxError).
      - run: >
          cppcheck --project=build/Debug/compile_commands.json
          --library=googletest
          --enable=warning,style,performance,portability
          --error-exitcode=1 --quiet

  package:
    needs: digest-sync
    runs-on: ubuntu-24.04
    container:
      image: ${{ needs.digest-sync.outputs.image }}
      options: --user root
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Add ndof public Conan remote
        run: conan remote add ndof-public https://conan.cloudsmith.io/ndof-opensource/packages/ --force
      # The one gate that exercises the Conan recipe itself: export the
      # sources, build, run the tests, and package via cmake --install. The
      # normal build jobs don't run conan create, so a recipe can be broken
      # while the code is green. This job catches that before publish time.
      - name: conan create
        run: conan create . --build=missing -pr:a /opt/conan/profiles/linux-gcc14 -s build_type=Release

  macos:
    runs-on: macos-14 # arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned tools
        # Into a venv on the PATH, mirroring the dev image's /opt/toolchain:
        # no PEP 668 override needed, and the same shape as Windows.
        # GITHUB_PATH takes effect from the next step onward.
        run: |
          python3 -m venv "$HOME/toolchain"
          "$HOME/toolchain/bin/pip" install "conan==$CONAN_VERSION" "cmake==$CMAKE_VERSION" "ninja==$NINJA_VERSION"
          echo "$HOME/toolchain/bin" >> "$GITHUB_PATH"
      - run: conan profile detect --force
      - name: Add ndof public Conan remote
        run: conan remote add ndof-public https://conan.cloudsmith.io/ndof-opensource/packages/ --force
      - run: conan install . --build=missing -s build_type=Release -s compiler.cppstd=23
      - run: cmake --preset release
      - run: cmake --build --preset release
      - run: ctest --preset release

  windows:
    runs-on: windows-2022 # MSVC
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned tools
        # Into a venv on the PATH, matching the macOS job; on Windows the
        # venv's executables live in Scripts, not bin.
        run: |
          python -m venv "$env:USERPROFILE\toolchain"
          & "$env:USERPROFILE\toolchain\Scripts\pip.exe" install "conan==$env:CONAN_VERSION" "cmake==$env:CMAKE_VERSION" "ninja==$env:NINJA_VERSION"
          Add-Content -Path $env:GITHUB_PATH -Value "$env:USERPROFILE\toolchain\Scripts"
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
      - run: conan profile detect --force
      - name: Add ndof public Conan remote
        run: conan remote add ndof-public https://conan.cloudsmith.io/ndof-opensource/packages/ --force
      # Force the Ninja generator: Conan's detected MSVC default is a
      # multi-config generator, whose cmake_layout writes build/generators;
      # our presets expect the single-config layout (build/<Type>/generators)
      # used on every other platform.
      - run: conan install . --build=missing -s build_type=Release -s compiler.cppstd=23 -c tools.cmake.cmaketoolchain:generator=Ninja
      - run: cmake --preset release
      - run: cmake --build --preset release
      - run: ctest --preset release
