# Reusable CI for all ndof library repositories.
#
# Each library repo calls this with the dev image pinned by digest. The Linux
# jobs run inside that image (identical to the local devcontainer); the macOS
# and Windows jobs run on native runners and are the portability enforcers —
# the container guarantees consistency, this matrix guarantees compatibility.
#
# Container jobs run with `--user root`: the runner's work directories belong
# to the host runner user, and actions must write state files there — the
# image's non-root `dev` user cannot (EACCES at checkout). Devcontainers are
# unaffected; they select `dev` via remoteUser.
#
# The digest-sync job asserts that the calling repo's devcontainer pins the
# same image it passed to this workflow. Both pins are updated by hand, and
# only ever together; this turns a forgotten half of that edit into a red X
# instead of a silently diverging local environment.

name: Library CI

on:
  workflow_call:
    inputs:
      image:
        description: "Dev-environment image reference (pin by digest in the calling repo)"
        required: true
        type: string

env:
  # Tool versions for the native macOS/Windows jobs.
  # Keep in sync with image/Dockerfile.
  CONAN_VERSION: 2.9.2
  CMAKE_VERSION: 3.30.5
  NINJA_VERSION: 1.11.1.1

jobs:
  digest-sync:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: devcontainer pin matches CI image
        env:
          CI_IMAGE: ${{ inputs.image }}
        # devcontainer.json is JSONC (comments allowed), so extract with sed
        # rather than a strict JSON parser.
        run: |
          devc_image=$(sed -n 's/^[[:space:]]*"image":[[:space:]]*"\([^"]*\)".*/\1/p' .devcontainer/devcontainer.json | head -n 1)
          if [[ -z "$devc_image" ]]; then
            echo '::error file=.devcontainer/devcontainer.json::no "image" entry found — every ndof repo pins its dev environment here'
            exit 1
          fi
          if [[ "$devc_image" != "$CI_IMAGE" ]]; then
            echo "::error file=.devcontainer/devcontainer.json::environment pins have drifted: devcontainer.json pins $devc_image but CI was called with $CI_IMAGE — update both pins in the same commit"
            exit 1
          fi
          echo "devcontainer and CI agree on $CI_IMAGE"

  format:
    runs-on: ubuntu-24.04
    container:
      image: ${{ inputs.image }}
      options: --user root
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: clang-format
        run: git ls-files '*.cpp' '*.hpp' | xargs -r clang-format --dry-run -Werror

  linux:
    runs-on: ubuntu-24.04
    container:
      image: ${{ inputs.image }}
      options: --user root
    strategy:
      fail-fast: false
      matrix:
        profile: [linux-gcc14, linux-clang19]
        build_type: [Debug, Release]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Resolve dependencies
        run: >
          conan install . --build=missing
          -pr:a /opt/conan/profiles/${{ matrix.profile }}
          -s build_type=${{ matrix.build_type }}
      - name: Configure
        run: cmake --preset ${{ matrix.build_type == 'Debug' && 'debug' || 'release' }}
      - name: Build
        run: cmake --build --preset ${{ matrix.build_type == 'Debug' && 'debug' || 'release' }}
      - name: Test
        run: ctest --preset ${{ matrix.build_type == 'Debug' && 'debug' || 'release' }}

  sanitize:
    name: ASan + UBSan
    runs-on: ubuntu-24.04
    container:
      image: ${{ inputs.image }}
      options: --user root
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - run: >
          conan install . --build=missing
          -pr:a /opt/conan/profiles/linux-clang19
          -s build_type=Debug
      - run: cmake --preset asan
      - run: cmake --build --preset asan
      - run: ctest --preset asan

  tidy:
    name: clang-tidy
    runs-on: ubuntu-24.04
    container:
      image: ${{ inputs.image }}
      options: --user root
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - run: >
          conan install . --build=missing
          -pr:a /opt/conan/profiles/linux-clang19
          -s build_type=Debug
      - run: cmake --preset debug
      - run: run-clang-tidy -p build/Debug -warnings-as-errors='*' -quiet

  macos:
    runs-on: macos-14 # arm64
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Install pinned tools
        # --break-system-packages: the runner's Python is externally managed
        # (PEP 668). No --user: its script dir is not on the runner's PATH,
        # so tools would install but not be findable. The runner is ephemeral;
        # installing into its Python prefix is fine and matches Windows.
        run: python3 -m pip install --break-system-packages "conan==$CONAN_VERSION" "cmake==$CMAKE_VERSION" "ninja==$NINJA_VERSION"
      - run: conan profile detect --force
      - run: conan install . --build=missing -s build_type=Release -s compiler.cppstd=23
      - run: cmake --preset release
      - run: cmake --build --preset release
      - run: ctest --preset release

  windows:
    runs-on: windows-2022 # MSVC
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Install pinned tools
        run: python -m pip install "conan==$env:CONAN_VERSION" "cmake==$env:CMAKE_VERSION" "ninja==$env:NINJA_VERSION"
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
      - run: conan profile detect --force
      # Force the Ninja generator: Conan's detected MSVC default is a
      # multi-config generator, whose cmake_layout writes build/generators —
      # our presets expect the single-config layout (build/<Type>/generators)
      # used on every other platform.
      - run: conan install . --build=missing -s build_type=Release -s compiler.cppstd=23 -c tools.cmake.cmaketoolchain:generator=Ninja
      - run: cmake --preset release
      - run: cmake --build --preset release
      - run: ctest --preset release
