# Reusable CI for all ndof library repositories.
#
# Each library repo calls this with the dev image pinned by digest. The Linux
# jobs run inside that image (identical to the local devcontainer); the macOS
# and Windows jobs run on native runners and are the portability enforcers —
# the container guarantees consistency, this matrix guarantees compatibility.

name: Library CI

on:
  workflow_call:
    inputs:
      image:
        description: "Dev-environment image reference (pin by digest in the calling repo)"
        required: true
        type: string

env:
  # Tool versions for the native macOS/Windows jobs.
  # Keep in sync with image/Dockerfile.
  CONAN_VERSION: 2.9.2
  CMAKE_VERSION: 3.30.5
  NINJA_VERSION: 1.11.1.1

jobs:
  format:
    runs-on: ubuntu-24.04
    container: ${{ inputs.image }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: clang-format
        run: git ls-files '*.cpp' '*.hpp' | xargs -r clang-format --dry-run -Werror

  linux:
    runs-on: ubuntu-24.04
    container: ${{ inputs.image }}
    strategy:
      fail-fast: false
      matrix:
        profile: [linux-gcc14, linux-clang19]
        build_type: [Debug, Release]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Resolve dependencies
        run: >
          conan install . --build=missing
          -pr:a /opt/conan/profiles/${{ matrix.profile }}
          -s build_type=${{ matrix.build_type }}
      - name: Configure
        run: cmake --preset ${{ matrix.build_type == 'Debug' && 'debug' || 'release' }}
      - name: Build
        run: cmake --build --preset ${{ matrix.build_type == 'Debug' && 'debug' || 'release' }}
      - name: Test
        run: ctest --preset ${{ matrix.build_type == 'Debug' && 'debug' || 'release' }}

  sanitize:
    name: ASan + UBSan
    runs-on: ubuntu-24.04
    container: ${{ inputs.image }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - run: >
          conan install . --build=missing
          -pr:a /opt/conan/profiles/linux-clang19
          -s build_type=Debug
      - run: cmake --preset asan
      - run: cmake --build --preset asan
      - run: ctest --preset asan

  tidy:
    name: clang-tidy
    runs-on: ubuntu-24.04
    container: ${{ inputs.image }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - run: >
          conan install . --build=missing
          -pr:a /opt/conan/profiles/linux-clang19
          -s build_type=Debug
      - run: cmake --preset debug
      - run: run-clang-tidy -p build/Debug -warnings-as-errors='*' -quiet

  macos:
    runs-on: macos-14 # arm64
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Install pinned tools
        run: python3 -m pip install --user "conan==$CONAN_VERSION" "cmake==$CMAKE_VERSION" "ninja==$NINJA_VERSION"
      - run: conan profile detect --force
      - run: conan install . --build=missing -s build_type=Release -s compiler.cppstd=23
      - run: cmake --preset release
      - run: cmake --build --preset release
      - run: ctest --preset release

  windows:
    runs-on: windows-2022 # MSVC
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Install pinned tools
        run: python -m pip install "conan==$env:CONAN_VERSION" "cmake==$env:CMAKE_VERSION" "ninja==$env:NINJA_VERSION"
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
      - run: conan profile detect --force
      - run: conan install . --build=missing -s build_type=Release -s compiler.cppstd=23
      - run: cmake --preset release
      - run: cmake --build --preset release
      - run: ctest --preset release
