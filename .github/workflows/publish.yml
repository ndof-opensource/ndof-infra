# Reusable Conan publish for ndof library repositories.
#
# Called by a stub on version-tag pushes (v0.1.1). Builds and tests the
# package in the pinned dev image, then uploads the recipe and sources
# (no binaries) to the public ndof Conan remote. Consumers, including our
# own CI, resolve the reference and compile locally via --build=missing,
# exactly as they already do for gtest.
#
# Publishing is tag-driven so every published version is immutable:
# re-publishing requires a conanfile version bump and a new tag, and the
# guard below keeps tag and conanfile version honest. The upload pattern
# "ndof-*" is deliberate: the build cache also contains third-party
# recipes (gtest), which must never be re-uploaded to our remote.

name: Publish Conan package

on:
  workflow_call:
    inputs:
      image:
        description: "Dev-environment image reference (pin by digest in the calling repo)"
        required: true
        type: string
    secrets:
      CLOUDSMITH_USER:
        required: true
      CLOUDSMITH_API_KEY:
        required: true

jobs:
  publish:
    runs-on: ubuntu-24.04
    container:
      image: ${{ inputs.image }}
      options: --user root
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify tag matches conanfile version
        run: |
          version=$(python3 -c "import re; print(re.search(r'version\s*=\s*\"([^\"]+)\"', open('conanfile.py').read()).group(1))")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match conanfile version $version; bump conanfile.py and re-tag"
            exit 1
          fi
      - name: Build and test the package
        run: conan create . --build=missing -pr:a /opt/conan/profiles/linux-gcc14 -s build_type=Release
      - name: Upload recipe and sources
        env:
          CLOUDSMITH_USER: ${{ secrets.CLOUDSMITH_USER }}
          CLOUDSMITH_API_KEY: ${{ secrets.CLOUDSMITH_API_KEY }}
        run: |
          conan remote add ndof-public https://conan.cloudsmith.io/ndof-opensource/packages/ --force
          conan remote login ndof-public "$CLOUDSMITH_USER" -p "$CLOUDSMITH_API_KEY"
          conan upload "ndof-*" -r ndof-public --only-recipe --confirm
