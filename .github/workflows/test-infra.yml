# Self-test for this repository: proves the Dockerfile, Conan profiles,
# project template, and generator script work *as a system* before a change
# merges. Builds the image (single-arch, never published), stamps a scratch
# project from the template, and runs the full library pipeline inside the
# freshly built image — the same sequence library CI runs.
#
# The digest/ref pins in library repos are the second firewall: even if a bad
# infra change lands, libraries only adopt it via an explicit pin-bump PR,
# which runs their CI against the new environment first.

name: Test infrastructure

on:
  pull_request:
  push:
    branches: [main]

jobs:
  self-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build image (amd64 only, not published)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: image/Dockerfile
          load: true
          tags: ndof-dev:selftest

      - name: Stamp a scratch project from the template
        run: |
          scripts/new-project.sh scratch "Infra self-test scratch project" /tmp/ndof-scratch
          if grep -rn "__PROJECT\|__GITHUB" /tmp/ndof-scratch --exclude-dir=.git; then
            echo "::error::unsubstituted template tokens remain"; exit 1
          fi
          if find /tmp/ndof-scratch -name '*__*' -not -path '*/.git/*' | grep .; then
            echo "::error::template token remains in a file or directory name"; exit 1
          fi
          # The container's dev user is uid 1000; the runner user is not.
          sudo chown -R 1000:1000 /tmp/ndof-scratch

      - name: Build and test in the image (GCC profile)
        run: |
          docker run --rm -v /tmp/ndof-scratch:/work -w /work ndof-dev:selftest bash -c '
            set -e
            conan install . --build=missing -pr:a /opt/conan/profiles/linux-gcc14 -s build_type=Debug
            cmake --preset debug
            cmake --build --preset debug
            ctest --preset debug
            conan create . --build=missing -pr:a /opt/conan/profiles/linux-gcc14 -s build_type=Release
          '

      - name: Build, test, sanitize, and lint in the image (Clang profile)
        run: |
          docker run --rm -v /tmp/ndof-scratch:/work -w /work ndof-dev:selftest bash -c '
            set -e
            rm -rf build
            conan install . --build=missing -pr:a /opt/conan/profiles/linux-clang19 -s build_type=Debug
            cmake --preset debug
            cmake --build --preset debug
            ctest --preset debug
            cmake --preset asan
            cmake --build --preset asan
            ctest --preset asan
            git add -A
            git ls-files "*.cpp" "*.hpp" | xargs -r clang-format --dry-run -Werror
            run-clang-tidy -p build/Debug -warnings-as-errors="*" -quiet
            cppcheck --project=build/Debug/compile_commands.json --library=googletest --enable=warning,style,performance,portability --error-exitcode=1 --quiet
          '
