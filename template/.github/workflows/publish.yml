# Publishes this library's Conan recipe to the public ndof remote when a
# version tag (v0.1.0) is pushed. All logic lives in the reusable workflow
# in ndof-infra; see ndof-infra/docs/releasing.md for the specific procedure.
#
# PUBLISH_SHA is a placeholder until ndof-infra's publish workflow exists on
# main; a follow-up PR then replaces it with the SHA of a main commit that
# contains that workflow. This workflow-ref SHA is bumped by hand (Dependabot
# cannot track a tagless repo).
name: Publish
on:
  push:
    tags: ["v*"]
jobs:
  publish:
    uses: ndof-opensource/ndof-infra/.github/workflows/publish.yml@PUBLISH_SHA # main YYYY-MM-DD
    secrets:
      CLOUDSMITH_USER: ${{ secrets.CLOUDSMITH_USER }}
      CLOUDSMITH_API_KEY: ${{ secrets.CLOUDSMITH_API_KEY }}
