# Publishes this library's Conan recipe to the public ndof remote when a
# version tag (v0.1.0) is pushed. All logic lives in the reusable workflow
# in ndof-infra; see ndof-infra/docs/releasing.md for the specific procedure.
# This workflow-ref SHA is maintained by ndof-infra's propagate-pins
# workflow (Dependabot cannot track a tagless repo).
name: Publish
on:
  push:
    tags: ["v*"]
jobs:
  publish:
    uses: ndof-opensource/ndof-infra/.github/workflows/publish.yml@612d79d93729142f74fcfc4af2f69a7441b7de88 # main 2026-10-09
    secrets:
      CLOUDSMITH_USER: ${{ secrets.CLOUDSMITH_USER }}
      CLOUDSMITH_API_KEY: ${{ secrets.CLOUDSMITH_API_KEY }}
